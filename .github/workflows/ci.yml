name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-web:
    name: Frontend Web (Next.js Enterprise)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Verify generated application catalogs
        working-directory: web
        run: npm run i18n:check

      - name: TypeScript type checking
        working-directory: web
        run: npx tsc --noEmit

      - name: Run web and 44-locale tests
        working-directory: web
        run: npm test -- --run

      - name: Build production bundle
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend Core (FastAPI & AI Engine)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: availability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "moto[s3]>=5.0.0"

      - name: Run backend validation suite
        run: |
          python -m pytest tests/backend/test_sales_date_regressions.py tests/backend/test_product_portfolio_scaling.py tests/backend/test_tenant_business_pages.py tests/backend/test_crm_suite.py tests/backend/test_central_ai.py tests/backend/test_ai_execution_security.py tests/backend/test_assistant_framework.py tests/backend/test_ai_chat.py tests/backend/test_phase30_tool_calling.py tests/backend/test_phase30_1_sse_tool_calling.py tests/backend/test_ai_credit_economics.py tests/backend/test_phase32_ai_gateway.py tests/backend/test_phase1_llm_usage.py tests/backend/test_phase2_credit_economics.py tests/backend/test_phase6_voice.py tests/backend/test_phase6_voice_usage_accounting.py tests/backend/test_phase34_migrations.py tests/backend/test_shopify_connector.py tests/backend/test_commerce_connection_service.py tests/backend/test_commerce_router.py tests/backend/test_commerce_sync_service.py tests/backend/test_commerce_sync_runner.py tests/backend/test_retail_active_source.py tests/backend/test_data_source_isolation.py tests/backend/test_connector_ai_evaluation_service.py tests/backend/test_internal_connector_ai.py tests/backend/test_security_center.py tests/backend/test_included_central.py tests/backend/test_voice_pin_setup_api.py tests/backend/test_credit_history_integrity.py tests/backend/test_claude_cache_cost.py tests/backend/test_voice_preview_integrity.py tests/backend/test_release_identity.py tests/backend/test_production_subscriptions_and_modules.py -q
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          AUTH_JWT_SECRET: "ci-secret-test-key-32-chars-long-minimum"
          DATABASE_URL: "sqlite:///:memory:"
          AVENQO_TEST_POSTGRES_URL: "postgresql+psycopg2://postgres:test-only-password@localhost:5432/availability_test"

      - name: Run Voice Master contract suite
        run: >-
          python -m pytest
          tests/backend/test_voice_agent.py
          tests/backend/test_telnyx_media.py
          tests/backend/test_voice_crm_end_to_end.py
          tests/backend/test_voice_number_service.py
          tests/backend/test_voice_health_service.py
          tests/backend/test_data_freshness_service.py
          tests/backend/test_phase33_billing_admin.py
          tests/backend/test_billing.py
          tests/backend/test_auth.py
          -q
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          AUTH_JWT_SECRET: "ci-secret-test-key-32-chars-long-minimum"
          DATABASE_URL: "sqlite:///:memory:"

  frontend-flutter:
    name: Frontend App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Static analysis
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

  security-incident-guard:
    name: Secret guard and credential transition
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rotation_test_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned secret scanner and inspect current tree
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact=100
          python scripts/check_secrets.py
      - name: Verify connector re-encryption and PostgreSQL login transition
        run: |
          pip install -r backend/requirements.txt
          python -m pytest tests/backend/test_connector_secret_cipher.py tests/backend/test_connector_secret_rotation.py tests/backend/test_connector_rotation_cli.py tests/backend/test_operational_database_credentials.py tests/backend/test_secret_commit_guard.py tests/security/test_postgres_credential_transition.py -q
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DATABASE_URL: 'sqlite:///:memory:'
          AUTH_JWT_SECRET: 'ci-test-only-fictional-auth-secret-long-enough'
          AVENQO_ROTATION_TEST_ADMIN_URL: 'postgresql+psycopg2://postgres:test-only-password@localhost:5432/rotation_test_ci'
