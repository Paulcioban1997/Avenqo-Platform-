name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-web:
    name: Frontend Web (Next.js Enterprise)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Verify generated application catalogs
        working-directory: web
        run: npm run i18n:check

      - name: TypeScript type checking
        working-directory: web
        run: npx tsc --noEmit

      - name: Run web and 44-locale tests
        working-directory: web
        run: npm test -- --run

      - name: Build production bundle
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend Core (FastAPI & AI Engine)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: availability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "moto[s3]>=5.0.0"

      - name: Run backend validation suite
        run: |
          python -m pytest tests/backend/test_sales_date_regressions.py tests/backend/test_product_portfolio_scaling.py tests/backend/test_tenant_business_pages.py tests/backend/test_crm_suite.py tests/backend/test_central_ai.py tests/backend/test_ai_execution_security.py tests/backend/test_assistant_framework.py tests/backend/test_ai_chat.py tests/backend/test_phase30_tool_calling.py tests/backend/test_phase30_1_sse_tool_calling.py tests/backend/test_ai_credit_economics.py tests/backend/test_phase32_ai_gateway.py tests/backend/test_phase1_llm_usage.py tests/backend/test_phase2_credit_economics.py tests/backend/test_phase6_voice.py tests/backend/test_phase6_voice_usage_accounting.py tests/backend/test_phase34_migrations.py -q
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          AUTH_JWT_SECRET: "ci-secret-test-key-32-chars-long-minimum"
          DATABASE_URL: "sqlite:///:memory:"
          AVENQO_TEST_POSTGRES_URL: "postgresql+psycopg2://postgres:test-only-password@localhost:5432/availability_test"

  frontend-flutter:
    name: Frontend App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Static analysis
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test
