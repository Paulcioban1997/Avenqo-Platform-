name: Backup freshness

'on':
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check-s3-backup:
    name: Verify latest S3 backup is fresh
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [sandbox, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check ${{ matrix.environment }} backup freshness
        env:
          PYTHONPATH: .
          ENVIRONMENT: ${{ matrix.environment }}
          DATABASE_URL: "sqlite:///:memory:"
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_MAX_AGE_HOURS: "26"
        run: python scripts/check_backup_freshness.py

