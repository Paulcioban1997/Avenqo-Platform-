name: P0 Artifact Export Validation

'on':
  pull_request:
    branches: [release/v1.0.0-rc1]
    paths:
      - '.github/workflows/artifact-export-validation.yml'
      - 'backend/Dockerfile.artifact-export'
      - 'backend/Dockerfile'
      - 'scripts/export_artifact_volume.py'
      - 'tests/backend/test_artifact_volume_export.py'
      - 'railway.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-export-image:
    name: Build and test isolated artifact exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fictional archive, encryption, S3 and restore
        run: |
          python -m pip install --disable-pip-version-check boto3==1.43.81 cryptography==50.0.0 moto==5.2.3 pytest==9.0.3
          # The repository-wide conftest imports the full FastAPI application.
          # This independent rescue test intentionally installs no app runtime.
          python -m pytest --confcutdir=tests/backend -q tests/backend/test_artifact_volume_export.py
      - name: Build the exact rescue Dockerfile
        run: |
          cmp backend/Dockerfile backend/Dockerfile.artifact-export
          # Production's existing RAILWAY_DOCKERFILE_PATH selects backend/Dockerfile.
          docker build --pull --iidfile /tmp/avenqo-artifact-export-image.id --file backend/Dockerfile .
          echo "Image ID: $(cat /tmp/avenqo-artifact-export-image.id)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify image cannot start the application or run without Production identity
        run: |
          image_id="$(cat /tmp/avenqo-artifact-export-image.id)"
          docker run --rm --entrypoint sh "$image_id" -c 'test ! -e /srv/backend && test ! -e /srv/alembic.ini && test ! -e /usr/local/bin/docker-entrypoint.sh'
          docker run --rm --entrypoint python "$image_id" -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("fastapi", "uvicorn", "alembic", "stripe", "telnyx"))'
          set +e
          output_no_args="$(docker run --rm "$image_id" 2>&1)"
          status_no_args=$?
          output_railway_cmd="$(docker run --rm "$image_id" sh -c 'python -m alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1' 2>&1)"
          status_railway_cmd=$?
          output_unexpected_args="$(docker run --rm "$image_id" --unexpected-flag arbitrary-arg 2>&1)"
          status_unexpected_args=$?
          set -e
          test "$status_no_args" -eq 1
          test "$output_no_args" = '{"status": "FAIL", "error_class": "ValueError"}'
          test "$status_railway_cmd" -eq 1
          test "$output_railway_cmd" = '{"status": "FAIL", "error_class": "ValueError"}'
          test "$status_unexpected_args" -eq 1
          test "$output_unexpected_args" = '{"status": "FAIL", "error_class": "ValueError"}'
